name: Deploy dev saksbehandling

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - frontend/saksbehandling/**
      - frontend/saksbehandling-server/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .npmrc
      - .dockerignore
      - nais/dev-gcp-saksbehandling.yaml
      - .github/workflows/deploy-dev-manual-saksbehandling.yml

concurrency:
  group: deploy-dev-saksbehandling
  cancel-in-progress: false

jobs:
  compile-test-and-build:
    name: Compile, test and build image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      VITE_ENABLE_MOCKS: "false"
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Typecheck frontend
        run: pnpm --filter ./frontend/saksbehandling typecheck

      - name: Typecheck server
        run: pnpm --filter ./frontend/saksbehandling-server typecheck

      - name: Login to NAIS (sets registry and OIDC)
        id: login
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        with:
          team: fager
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Build and push image
        id: docker-build-push
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        with:
          team: fager
          image_suffix: saksbehandling
          tag: ${{ github.sha }}
          docker_context: .
          dockerfile: frontend/saksbehandling-server/Dockerfile
          build_args: |
            NODE_AUTH_TOKEN=${{ secrets.READER_TOKEN }}
            VITE_ENABLE_MOCKS=${{ env.VITE_ENABLE_MOCKS }}
          salsa: true

  deploy-to-dev-gcp:
    name: Deploy to dev-gcp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    needs: compile-test-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to NAIS (sets registry and OIDC)
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        with:
          team: fager

      - name: Deploy dev-gcp
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais/dev-gcp-saksbehandling.yaml
          PRINT_PAYLOAD: "true"
          VAR: image=${{ needs.compile-test-and-build.outputs.image }}
          REF: ${{ github.sha }}
