name: Playwright

on:
  push:
    paths:
      - ".github/workflows/playwright.yml"
      - "frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/workflows/playwright.yml"
      - "frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Install Chromium headless shell
        run: pnpm --filter ./frontend/client exec playwright install --with-deps --only-shell chromium

      - name: Run client Playwright tests
        run: pnpm --filter ./frontend/client e2e

      - name: Run saksbehandling accessibility tests
        run: pnpm --filter ./frontend/saksbehandling e2e
