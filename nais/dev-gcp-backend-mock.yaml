apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: ekspertbistand-backend-mock
  namespace: fager
  labels:
    team: fager
spec:
  # Mock-backend for ekspertbistand-saksbehandling-mock og ekspertbistand-frontend-mock.
  # Kjører LocalApplication-oppsettet (MockApplication) med mockede eksterne tjenester.
  # Databasen tømmes og fylles med testdata ved hver oppstart.
  # Godtar faketoken, så den skal aldri ha ingress eller andre inbound-regler enn mock-BFF-ene.
  image: {{ image }}
  port: 8080

  replicas:
    min: 1
    max: 1

  # Ny pod tømmer databasen ved oppstart, så to versjoner kan ikke dele den. Gammel pod stoppes først.
  strategy:
    type: Recreate

  liveness:
    path: /internal/isalive
    initialDelay: 30

  readiness:
    path: /internal/isready
    initialDelay: 30

  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki

  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1024Mi

  gcp:
    sqlInstances:
      - name: ekspertbistand-backend-mock
        type: POSTGRES_18
        tier: db-f1-micro
        diskAutoresize: true
        highAvailability: false
        databases:
          - name: ekspertbistand
            envVarPrefix: DB

  accessPolicy:
    inbound:
      rules:
        - application: ekspertbistand-saksbehandling-mock
        - application: ekspertbistand-frontend-mock
    outbound:
      rules:
        - application: ekspertbistand-gotenberg
        - application: logging
          namespace: nais-system
