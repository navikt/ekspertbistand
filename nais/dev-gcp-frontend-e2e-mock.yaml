apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: ekspertbistand-frontend-e2e-mock
  namespace: fager
  labels:
    team: fager
spec:
  image: {{{ image }}}
  port: 4000
  ingresses:
    - https://ekspertbistand-arbeidsgiver-e2e-mock.ansatt.dev.nav.no/ekspertbistand
  env:
    - name: BASE_PATH
      value: "/ekspertbistand"
    - name: EKSPERTBISTAND_API_BASEURL
      value: "http://ekspertbistand-backend-mock"
    - name: LOKAL_INNLOGGING
      value: "true"

  accessPolicy:
    outbound:
      rules:
        - application: ekspertbistand-backend-mock

  replicas:
    min: 1
    max: 1

  tokenx:
    enabled: false

  idporten:
    enabled: false

  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
    logging:
      destinations:
        - id: loki

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  liveness:
    path: /ekspertbistand/internal/isAlive

  readiness:
    path: /ekspertbistand/internal/isAlive
