services:
  app:
    image: ekspertbistand:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-/}
        BUILDER_IMAGE: ${BUILDER_IMAGE:-europe-north1-docker.pkg.dev/cgr-nav/pull-through/nav.no/node:24-dev}
        RUNNER_IMAGE: ${RUNNER_IMAGE:-europe-north1-docker.pkg.dev/cgr-nav/pull-through/nav.no/node:24-slim}
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN}
    container_name: ekspertbistand
    environment:
      NODE_ENV: production
      PORT: ${PORT:-4000}
      BASE_PATH: ${BASE_PATH:-/}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    restart: unless-stopped
