name: CICD Gotenberg
on:
  push:
    paths:
      - gotenberg/**
      - nais/dev-gcp-gotenberg.yaml
      - nais/prod-gcp-gotenberg.yaml
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # bygg nytt image hver mandag morgen

jobs:
  compile-test-and-build:
    name: Compile, build and deploy image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        id: docker-build-push
        with:
          team: fager
          image_suffix: gotenberg
          tag: ${{ github.sha }}
          dockerfile: gotenberg/Dockerfile
          docker_context: gotenberg
          salsa: true
          no_cache: true

  deploy-dev:
    if: github.ref == 'refs/heads/main'
    needs: [ compile-test-and-build ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Deploy dev-gcp
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          VAR: image=${{ needs.compile-test-and-build.outputs.image }}
          RESOURCE: nais/dev-gcp-gotenberg.yaml
          CLUSTER: dev-gcp

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: [ compile-test-and-build ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Deploy prod-gcp
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          VAR: image=${{ needs.compile-test-and-build.outputs.image }}
          RESOURCE: nais/prod-gcp-gotenberg.yaml
          CLUSTER: prod-gcp
