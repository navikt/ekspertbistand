name: CICD Gotenberg
on:
  push:
    paths:
      - gotenberg9/**
      - nais/dev-gcp-gotenberg9.yaml
      - nais/prod-gcp-gotenberg9.yaml
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # bygg og deploy hver natt kl. 04
      timezone: Europe/Oslo

jobs:
  # Ved ny major: legg den nye appen i matrisen (og i paths for cicd) og kjør den ved siden av den gamle til backend har byttet.
  # Bygg og deploy ligger i samme jobb fordi outputs fra matrisejobber overskriver hverandre.
  build-and-deploy:
    name: Build and deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: [ gotenberg9 ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f # v0
        id: docker-build-push
        with:
          team: fager
          image_suffix: ${{ matrix.app }}
          tag: ${{ github.sha }}
          dockerfile: ${{ matrix.app }}/Dockerfile
          docker_context: ${{ matrix.app }}
          salsa: true
          no_cache: true

      - name: Deploy dev-gcp
        if: github.ref == 'refs/heads/main'
        uses: nais/deploy/actions/deploy@b1a9a40dae937091497f8f29c5ea5334cc1c0643 # v3
        env:
          VAR: image=${{ steps.docker-build-push.outputs.image }}
          RESOURCE: nais/dev-gcp-${{ matrix.app }}.yaml
          CLUSTER: dev-gcp

      - name: Deploy prod-gcp
        if: github.ref == 'refs/heads/main'
        uses: nais/deploy/actions/deploy@b1a9a40dae937091497f8f29c5ea5334cc1c0643 # v3
        env:
          VAR: image=${{ steps.docker-build-push.outputs.image }}
          RESOURCE: nais/prod-gcp-${{ matrix.app }}.yaml
          CLUSTER: prod-gcp
