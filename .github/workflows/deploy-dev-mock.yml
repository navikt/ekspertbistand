name: Deploy dev mock (saksbehandling + backend)

# ekspertbistand-saksbehandling-mock mot ekspertbistand-backend-mock.
# Se specifications/saksbehandling_mock_mot_mocka_backend.md.
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/saksbehandling/**
      - frontend/saksbehandling-server/**
      - nais/dev-gcp-backend-mock.yaml
      - nais/dev-gcp-saksbehandling-mock.yaml
      - .github/workflows/deploy-dev-mock.yml

permissions:
  contents: read

jobs:
  build-backend-mock:
    name: Build backend mock image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Testene kjøres i cicd-backend.yaml. -DskipTests kompilerer fortsatt test-klassene mocken trenger.
      - name: Build
        run: mvn -B -Pmock -DskipTests package
        working-directory: backend

      - name: Build and push image
        id: docker-build-push
        uses: nais/docker-build-push@v0
        with:
          team: fager
          image_suffix: backend-mock
          tag: ${{ github.sha }}
          dockerfile: backend/Dockerfile.mock
          docker_context: backend

  build-saksbehandling-mock:
    name: Build saksbehandling mock image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Typecheck frontend
        run: pnpm --filter ./frontend/saksbehandling typecheck

      - name: Typecheck server
        run: pnpm --filter ./frontend/saksbehandling-server typecheck

      - name: Login to NAIS (sets registry and OIDC)
        uses: nais/login@v0
        with:
          team: fager
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Build and push image
        id: docker-build-push
        uses: nais/docker-build-push@v0
        with:
          team: fager
          image_suffix: saksbehandling-mock
          tag: ${{ github.sha }}
          docker_context: .
          dockerfile: frontend/saksbehandling-server/Dockerfile
          build_args: |
            NODE_AUTH_TOKEN=${{ secrets.READER_TOKEN }}
            VITE_LOKAL_BRUKERBYTTE=true
          salsa: true

  deploy:
    name: Deploy to dev-gcp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    needs: [ build-backend-mock, build-saksbehandling-mock ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy backend mock
        uses: nais/deploy/actions/deploy@v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais/dev-gcp-backend-mock.yaml
          VAR: image=${{ needs.build-backend-mock.outputs.image }}
          REF: ${{ github.sha }}

      - name: Deploy saksbehandling mock
        uses: nais/deploy/actions/deploy@v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais/dev-gcp-saksbehandling-mock.yaml
          VAR: image=${{ needs.build-saksbehandling-mock.outputs.image }}
          REF: ${{ github.sha }}
