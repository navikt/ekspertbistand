apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: ekspertbistand-saksbehandling-mock
  namespace: fager
  labels:
    team: fager
spec:
  # Saksbehandling mot ekspertbistand-backend-mock, uten innlogging. Brukervelgeren bytter mellom testbrukerne
  # i LocalApplication. Se specifications/saksbehandling_mock_mot_mocka_backend.md.
  image: {{ image }}
  port: 4000
  ingresses:
    - https://ekspertbistand-saksbehandling-mock.ansatt.dev.nav.no

  replicas:
    min: 1
    max: 1

  tokenx:
    enabled: false

  idporten:
    enabled: false

  env:
    - name: EKSPERTBISTAND_API_BASEURL
      value: "http://ekspertbistand-backend-mock"
    - name: LOKAL_BRUKERBYTTE
      value: "true"

  accessPolicy:
    outbound:
      rules:
        - application: ekspertbistand-backend-mock

  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
    logging:
      destinations:
        - id: loki

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  liveness:
    path: /internal/isAlive

  readiness:
    path: /internal/isAlive
