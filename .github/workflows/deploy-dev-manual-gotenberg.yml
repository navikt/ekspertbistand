name: Manuell deploy dev gotenberg

on:
  workflow_dispatch:

jobs:
  # Ved ny major: legg den nye appen i matrisen og kjør den ved siden av den gamle til backend har byttet.
  build-and-deploy:
    name: Build and deploy ${{ matrix.app }} to dev-gcp
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: [ gotenberg9 ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and push image
        id: docker-build-push
        uses: nais/docker-build-push@6394144a53cad0332745f24a8302f5efaf81719a # v1.0.0
        with:
          team: fager
          image_suffix: ${{ matrix.app }}
          tag: ${{ github.sha }}
          dockerfile: ${{ matrix.app }}/Dockerfile
          docker_context: ${{ matrix.app }}
          salsa: true
          no_cache: true

      - name: Login to NAIS (sets registry and OIDC)
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        with:
          team: fager

      - name: Deploy dev-gcp
        uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # v3
        env:
          VAR: image=${{ steps.docker-build-push.outputs.image }}
          RESOURCE: nais/dev-gcp-${{ matrix.app }}.yaml
          CLUSTER: dev-gcp
