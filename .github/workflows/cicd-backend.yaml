name: CICD Backend
on:
  push:
    paths:
      - backend/**
      - nais/dev-gcp-backend.yaml
      - nais/prod-gcp-backend.yaml
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # bygg og deploy hver natt kl. 04
      timezone: Europe/Oslo


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5532:5432
      gotenberg:
        image: gotenberg/gotenberg:9.8.0-chromium
        env:
          CHROMIUM_DISABLE_JAVASCRIPT: "true"
          CHROMIUM_ALLOW_LIST: "^file:///tmp/.*"
          API_DISABLE_DOWNLOAD_FROM: "true"
          WEBHOOK_DISABLE: "true"
          CHROMIUM_MAX_CONCURRENCY: "2"
        options: >-
          --health-cmd "curl -fsS http://localhost:3000/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3003:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: PGPASSWORD=postgres psql -U postgres -h localhost -p 5532 -f ./backend/local-db-init.sql

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - run: mvn -B package
        working-directory: backend

      - uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f # v0
        id: docker-build-push
        with:
          team: fager
          image_suffix: backend
          tag: ${{ github.sha }}
          dockerfile: backend/Dockerfile
          docker_context: backend

    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

  deploy-dev:
    if: github.ref == 'refs/heads/main'
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/deploy/actions/deploy@b1a9a40dae937091497f8f29c5ea5334cc1c0643 # v3
        name: Deploy dev-gcp
        env:
          VAR: image=${{ needs.build.outputs.image }}
          RESOURCE: nais/dev-gcp-topic-bestillinger.yaml,nais/dev-gcp-backend.yaml
          CLUSTER: dev-gcp

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/deploy/actions/deploy@b1a9a40dae937091497f8f29c5ea5334cc1c0643 # v3
        name: Deploy prod-gcp
        env:
          VAR: image=${{ needs.build.outputs.image }}
          RESOURCE: nais/prod-gcp-topic-bestillinger.yaml,nais/prod-gcp-backend.yaml
          CLUSTER: prod-gcp