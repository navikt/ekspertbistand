name: Manuell deploy dev gotenberg

on:
  workflow_dispatch:

jobs:
  compile-and-build:
    name: Build gotenberg image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and push image
        id: docker-build-push
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        with:
          team: fager
          image_suffix: gotenberg
          tag: ${{ github.sha }}
          dockerfile: gotenberg/Dockerfile
          docker_context: gotenberg
          salsa: true
          no_cache: true

  deploy-to-dev-gcp:
    name: Deploy to dev-gcp
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: compile-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to NAIS (sets registry and OIDC)
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        with:
          team: fager

      - name: Deploy dev-gcp
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          VAR: image=${{ needs.compile-and-build.outputs.image }}
          RESOURCE: nais/dev-gcp-gotenberg.yaml
          CLUSTER: dev-gcp
