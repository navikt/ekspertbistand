name: Manuell deploy dev frontend mock

on:
  workflow_dispatch: {}
  push:
    paths:
      - frontend/**
    branches:
      - main

jobs:
  compile-test-and-build:
    name: Compile, test and build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      CDN_DESTINATION: /ekspertbistand-mock/${{ github.sha }}
      CDN_PUBLIC_BASE: https://cdn.nav.no/fager/ekspertbistand-mock/${{ github.sha }}
      BASE_PATH: /ekspertbistand
      VITE_ENABLE_MOCKS: "true"
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com/
          cache: pnpm

      - name: Install server production dependencies
        run: pnpm --filter ./frontend/server install --frozen-lockfile --prod
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Run tests
        run: pnpm test

      - name: Build workspace
        run: pnpm run build
        env:
          VITE_BASE_PATH: ${{ env.CDN_PUBLIC_BASE }}
          VITE_ENABLE_MOCKS: ${{ env.VITE_ENABLE_MOCKS }}

      - name: Upload static assets to NAIS CDN
        uses: nais/deploy/actions/cdn-upload/v2@3944168fd20b7eea3818e97de3810f74b54c78ff # master
        with:
          team: fager
          source: ./frontend/client/dist
          destination: ${{ env.CDN_DESTINATION }}
          source_keep_parent_name: false

      - name: Login to NAIS (sets registry and OIDC)
        id: login
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        with:
          team: fager
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Build and push image
        id: docker-build-push
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        with:
          team: fager
          image_suffix: frontend-mock
          tag: ${{ github.sha }}
          docker_context: .
          dockerfile: Dockerfile
          build_args: |
            NODE_AUTH_TOKEN=${{ secrets.READER_TOKEN }}
            BASE_PATH=${{ env.BASE_PATH }}
            VITE_BASE_PATH=${{ env.CDN_PUBLIC_BASE }}
            VITE_ENABLE_MOCKS=${{ env.VITE_ENABLE_MOCKS }}
          salsa: true

  deploy-to-dev-gcp:
    name: Deploy to dev-gcp
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: compile-test-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to NAIS (sets registry and OIDC)
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        with:
          team: fager

      - name: Deploy dev-gcp
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais/dev-gcp-frontend-mock.yaml
          PRINT_PAYLOAD: "true"
          VAR: image=${{ needs.compile-test-and-build.outputs.image }}
          REF: ${{ github.sha }}
